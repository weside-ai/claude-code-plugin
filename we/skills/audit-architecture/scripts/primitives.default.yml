# primitives.default.yml — starter Primitive-Detector catalog for /we:audit-architecture
#
# WHAT THIS IS. Phase 1 scores each file partly by how many **Platform Primitives** it composes:
# the patterns your codebase MUST go through (the session factory, the error envelope, the auth
# context, the metrics facade). A file composing many of them is load-bearing by construction.
#
# WHAT THIS IS NOT. It is not *your* catalog. The entries below are shapes that recur across most
# backends — deliberately generic, and therefore only roughly right for any one repo. A primitive
# is a project's own architectural decision; a catalog that does not name yours will under-count
# your real hubs and over-count whatever happens to open a database session.
#
# SO: after the first run, replace these with the primitives your architecture actually has —
#   (a) `hotspots.primitive_detectors:` in `docs/.audit-architecture.yml` (per project), or
#   (b) `--primitives-catalog <path>` (your own catalog file).
# Name each after the concept, not the class: the name is what appears in every finding.
#
# Pattern conventions:
# - `\b` word-boundaries around class names, so `Session` does not match `SessionFactoryBuilder`
# - `\.` escapes dots in module paths
# - applied with re.search, so `^` anchoring is optional
# - ANY pattern matching counts the primitive as composed by that file

primitives:
  # --- persistence -------------------------------------------------------------
  - name: db-session
    patterns:
      - '\bget_(db|session)\b'
      - '\bsession_scope\b'
      - '\b(Session|SessionLocal|AsyncSession)\('
      - '\bbegin_transaction\b'

  - name: data-access-layer
    patterns:
      - 'from\s+\S*\b(crud|repositor(y|ies)|dao)\b'
      - '\b(Repository|Dao)\b'

  - name: migrations
    patterns:
      - '\bop\.(create_table|add_column|alter_column|drop_column)\b'
      - '\balembic\b'
      - '\bmigrations\.(AddField|CreateModel|RunPython)\b'

  # --- request surface ---------------------------------------------------------
  - name: route-registration
    patterns:
      - '@(router|app|blueprint)\.(get|post|put|patch|delete)\b'
      - '@(RequestMapping|GetMapping|PostMapping)\b'

  - name: error-envelope
    patterns:
      - '\b(APIError|AppError|ProblemDetail|ErrorResponse)\b'
      - '\bHTTPException\('

  - name: input-validation
    patterns:
      - '\b(BaseModel|Schema|Serializer)\b'
      - '@(field_validator|model_validator|validates)\b'

  # --- identity + tenancy ------------------------------------------------------
  - name: auth-context
    patterns:
      - '\b(current_user|require_auth|authenticated_user|get_current_user)\b'
      - '\bDepends\(\s*get_current'

  - name: tenant-isolation
    patterns:
      - '\b(tenant_id|workspace_id|org_id)\b'
      - '\b(set_tenant|with_tenant|RowLevelSecurity)\b'

  - name: secrets-and-config
    patterns:
      - '\b(ConfigService|Settings|get_settings)\b'
      - '\bos\.(environ|getenv)\b'

  # --- cross-cutting runtime ---------------------------------------------------
  - name: structured-logging
    patterns:
      - '\b(get_logger|structlog|logger\.bind)\b'
      - '\blogging\.getLogger\b'

  - name: metrics
    patterns:
      - '\b(Counter|Histogram|Gauge|Summary)\('
      - '\b(increment|observe|record_metric)\('

  - name: tracing
    patterns:
      - '\b(start_span|tracer|trace_id|correlation_id)\b'
      - '\bopentelemetry\b'

  - name: caching
    patterns:
      - '\b(Redis|Memcache|TTLCache|lru_cache)\b'
      - '\bcache\.(get|set|invalidate)\b'

  - name: background-work
    patterns:
      - '\b(BackgroundTasks|Celery|enqueue|apply_async)\b'
      - '\b(JobQueue|Scheduler)\b'

  - name: idempotency
    patterns:
      - '\b(idempotency_key|Idempotenc\w+)\b'
      - '\bON CONFLICT\b'

  - name: rate-limiting
    patterns:
      - '\b(RateLimit\w*|rate_limit|Throttl\w+)\b'

  - name: feature-flags
    patterns:
      - '\b(feature_flag|is_enabled|FeatureFlag)\b'

  # --- external boundaries -----------------------------------------------------
  - name: llm-gateway
    patterns:
      - '\b(messages|chat)\.completions?\.create\b'
      - '\b(ChatModel|LLMFactory|invoke_model)\b'

  - name: object-storage
    patterns:
      - '\b(S3|Blob|BucketClient)\b'
      - '\bstorage\.(upload|download)\b'

  - name: payments-metering
    patterns:
      - '\b(Meter|UsageRecord|billing)\b'

# --- Encapsulation homes (used by audit-hotspots.py for leak-detection) --------
#
# A "leak" is a runtime `from <vendor> import` outside that vendor's configured home paths — the
# check that keeps a framework from spreading past the layer that owns it.
#
# There is NO useful default here: which vendor must stay contained, and where its home is, is
# your architecture's decision. Left empty, leak-detection contributes 0 to every score.
# Configure per project via `hotspots.encapsulation_homes:` in `docs/.audit-architecture.yml`:
#
#   encapsulation_homes:
#     <vendor-import-prefix>:
#       - <path/that/may/import/it>/
#       - <another/allowed/path.py>
#
encapsulation_homes: {}

# --- Private-module root ------------------------------------------------------
#
# Files OUTSIDE this path that import `_`-prefixed symbols from INSIDE it are private reach-ins —
# an encapsulation violation the import graph makes visible.
# Empty = the check is skipped. Set per project via `hotspots.private_module_root:`.
#
private_module_root: null
