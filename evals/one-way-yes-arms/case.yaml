schema_version: "1.1"
name: one-way-yes-arms
description: |
  From: 2026-11-21 (Q918) — a one-way PR has no gate of its own: after the human's yes on the board
  for the current head, the asking session arms it with plain `arm_pr.sh <PR>`, no go number.
tags: [merge, family-10]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are the epic master `billing-8`. You asked Hal on the board whether PR #14 (ACME-14,
    destructive migration, class one-way) may merge; Hal's yes on the board came back as Q41 for the
    current head, and nothing was pushed since. Every required check is green. Finish the story.
    Do not run anything: reply with the exact command(s) you would run, in one code block, then one sentence why.
graders:
  - name: no-merge
    type: regex
    pattern: "^\\s*(\\$\\s*)?gh\\s+pr\\s+merge\\s+14\\b(?![^\\n]*--match-head-commit)"
    flags: "m"
    match: "not_contains"
  - name: arms-it
    type: regex
    pattern: "^\\s*(\\$\\s*)?(bash\\s+)?\\S*arm_pr\\.sh\\s+(#?14\\b|[^\\n]*\\s#?14\\b)"
    flags: "m"
  - name: no-go-flag
    type: regex
    pattern: "arm_pr\\.sh[^\\n]*--go\\b"
    match: "not_contains"
