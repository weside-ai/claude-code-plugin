schema_version: "1.1"
name: retro-broadcast-caps-entries
description: |
  From: 2026-11-25 — the last two broadcasts returned 73 and 27 keys; most were one-off wishes
  the decider then had to reject one by one.
tags: [retro, family-11]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are Otto, the coordinator of this crew. The human asked you to run `/we:retro --broadcast`
    without a focus; Ada, Vic and Kit are running. Do not send or write anything: reply with the exact brief one recipient gets, in one
    code block.
graders:
  - name: at-most-two
    type: regex
    pattern: "at most (two|2)|no more than (two|2)|up to (two|2)"
    flags: "i"
  - name: nothing-is-expected
    type: regex
    pattern: "`?nothing`? is (the )?expected|expected answer"
    flags: "i"
