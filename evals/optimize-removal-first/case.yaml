schema_version: "1.1"
name: optimize-removal-first
description: |
  From: 2026-11-25 — with a full inbox the run decided ten adds and stopped; the due removals
  never came up.
tags: [optimize, family-11]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are Hana, the hr role, running `/we:optimize` in this repo; the inbox holds thirteen adds.
    Do not write anything: reply with the keys of the first three candidates you put to the decider,
    in order, one per line, nothing else.
graders:
  - name: removal-before-any-add
    type: regex
    pattern: "^(?:(?!gap--)[\\s\\S])*sunset--"
