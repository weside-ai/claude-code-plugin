schema_version: "1.1"
name: optimize-unproven-sunset
description: |
  From: 2026-11-25 — 24 ledger rows reached review_by with no measured effect; the old rule kept
  every one of them forever because the failure "never recurred".
tags: [optimize, family-11]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are Hana, the hr role, running `/we:optimize` step 4 on this repo's ledger. Do not send or write anything:
    reply with the keys of the candidates step 4 writes, one per line, nothing else.
graders:
  - name: unproven-row-is-candidate
    type: regex
    pattern: "sunset--gap--claude-rules-review-md"
  - name: mandatory-class-stays
    type: regex
    pattern: "sunset--gap--claude-rules-payments-md"
    match: "not_contains"
