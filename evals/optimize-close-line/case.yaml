schema_version: "1.1"
name: optimize-close-line
description: |
  From: 2026-11-25 — optimize runs closed with applied/rejected counts only; nobody saw that the
  rules grew by about 300 lines in two months.
tags: [optimize, family-11]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are Hana, the hr role, at the end of a `/we:optimize` run in this repo. Facts: 2 applied, 3
    rejected, 12 left in the inbox; step 4 read 2 ledger rows and found 1 remove candidate;
    `.claude/rules/review.md` lost 1 line, `docs/topic-1.md` gained 1 line; `check-instruction-budget.py
    --totals` printed `all 5014` before the run and `all 5014` after it. Do not write anything: reply
    with the run's closing line only.
graders:
  - name: lines-per-file
    type: regex
    pattern: "review\\.md[^\\n]*(−|-)\\s*1|(−|-)\\s*1[^\\n]*review\\.md"
  - name: all-change
    type: regex
    pattern: "\\ball\\b[^\\n]*(5014|±\\s*0|\\+0|0\\b)"
    flags: "i"
  - name: step-4-rows
    type: regex
    pattern: "remov\\w*\\W+candidate|candidates?\\W+(to|for)\\W+remov"
    flags: "i"
