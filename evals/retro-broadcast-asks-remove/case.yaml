schema_version: "1.1"
name: retro-broadcast-asks-remove
description: |
  From: 2026-11-25 — two broadcasts asked only for what was missing: 100 keys, none a removal,
  and the instruction files grew with every run.
tags: [retro, family-11]
plugins: ["../../we"]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    You are Otto, the coordinator of this crew. The human asked you to run `/we:retro --broadcast`
    without a focus; Ada, Vic and Kit are running. Do not send or write anything: reply with the exact brief one recipient gets, in one
    code block.
graders:
  - name: asks-what-did-not-help
    type: regex
    pattern: "did not help|didn't help|not help(ed)?|without (effect|use)"
    flags: "i"
  - name: asks-what-to-delete
    type: regex
    pattern: "delet|remov"
    flags: "i"
  - name: reply-line-counts-removes
    type: regex
    pattern: "RETRO\\s*·[^\\n]*add[^\\n]*remove"
    flags: "i"
