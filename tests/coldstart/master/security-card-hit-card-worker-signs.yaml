id: security-card-hit-card-worker-signs
role: master
crew: we/scripts/fixtures/crew-v2-security.json
env: {WE_ROLE: master}
world:
  docs/plans/PROJ-15-story.md: "a T2 story whose diff loosens a tenant check (classifier: T2, hit trust-loosening)"
prompt: >
  PROJ-15 is In Progress, tier T2, the classifier prints `T2` with a `trust-loosening:` hit line (a
  tenant check is loosened). The panel is green and its PR is open. What do you do next and who do
  you wait on, in which order? Answer in the JSON schema.
expect:
  next_verb: [we-worker, worker, master, board]
  waits: [worker]
  not_waits: [human, product, acceptance, security]
  route: "(?i)(card|sign)"
  forbidden: ["gh pr merge --auto"]
judge: null
