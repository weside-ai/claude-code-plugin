id: security-twoway-before8-waits
role: master
crew: we/scripts/fixtures/crew-v2-security.json
env: {WE_ROLE: master}
world:
  docs/plans/PROJ-16-story.md: "a T2 story whose diff touches auth (class two-way)"
prompt: >
  Plugin `we` is at 7.71.0. PROJ-16 is In Progress, tier T2, class two-way; its diff touches the
  auth middleware. The panel is green and its PR is open. What do you do next and who do you wait
  on? Answer in the JSON schema.
expect:
  next_verb: [master]
  waits: [security]
  not_waits: [human]
  route: "review"
  forbidden: ["gh pr merge --auto"]
judge: null
