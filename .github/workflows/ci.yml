name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Pin ruff. An unpinned install silently changed the gate and turned
      # main red: a newer ruff formats Markdown by default (previously
      # preview-only) and moved PLR0917 out of preview. Worse, its Markdown
      # formatter mangles MCP tool names in python code blocks — it reads
      # `mcp__plugin_we_weside-mcp__get_council` as a subtraction and rewrites
      # it to `mcp__plugin_we_weside - mcp__get_council`, silently corrupting
      # the council skill's instructions. Bump this deliberately (Renovate
      # opens a PR), never by surprise.
      - run: pip install ruff==0.15.22
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  validate:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Validate JSON files
        run: |
          for f in .claude-plugin/marketplace.json we/.claude-plugin/plugin.json we/.mcp.json we/hooks/hooks.json; do
            echo "Checking $f..."
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Validate frontmatter
        run: python3 scripts/validate-frontmatter.py we/skills/*/SKILL.md we/agents/*.md

      - name: Validate plugin structure
        run: bash scripts/validate-plugin-structure.sh

      - name: Validate cross-file consistency
        run: python3 scripts/validate-consistency.py

      - name: Instruction budget gate
        run: |
          pip install pyyaml
          python3 we/scripts/check-instruction-budget.py

  tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install pytest pyyaml
      - name: Run pytest over we/ and scripts/
        run: python3 -m pytest -q we scripts

  tests-floor:
    # The plugin's Python floor (README § Requirements): macOS ships 3.9.6 as /usr/bin/python3,
    # and the hooks run on whatever `python3` the user has. uv fetches 3.9, which setup-python
    # no longer guarantees on current runners.
    name: Plugin Tests (Python 3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install uv
      - name: Run pytest over we/ on Python 3.9
        # No PyYAML: macOS /usr/bin/python3 lacks it, so this lane runs the lenient parser.
        run: uv run --no-project --python 3.9 --with pytest python -m pytest -q we scripts

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships shellcheck; warnings and errors fail, info notes do not.
      - run: cd we/scripts && shellcheck -x -S warning ./*.sh we-worker wclaude

  hooks-module:
    # The /flow and /board hooks module (TypeScript) against Claude Code's own engine: its types
    # come from Claude Code, so `plugin validate` is the typecheck. Needs no login. Pin the CLI
    # and bump it deliberately (Renovate), like ruff above.
    name: Hooks Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g @anthropic-ai/claude-code@2.1.321
      - run: claude plugin validate we
      - run: claude plugin test we

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx markdownlint-cli2 "**/*.md"

  version-check:
    name: Version Bump Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The check runs from the default branch's copy: a PR that edits it must not pass its own test.
      - name: Load the check from the default branch
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git fetch -q origin "$DEFAULT"
          if git cat-file -e FETCH_HEAD:scripts/version_bump.py 2>/dev/null; then
            git show FETCH_HEAD:scripts/version_bump.py > "$RUNNER_TEMP/version_bump.py"
          else
            echo "::warning::${DEFAULT} has no scripts/version_bump.py yet; using this PR's copy."
            cp scripts/version_bump.py "$RUNNER_TEMP/version_bump.py"
          fi
      # The PR author comes from the event: no commit can set it.
      - name: A PR leaves the version alone; only the App's one-step bump PR moves it
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 "$RUNNER_TEMP/version_bump.py" check "origin/$DEFAULT" "$HEAD_SHA" --author "$AUTHOR"
