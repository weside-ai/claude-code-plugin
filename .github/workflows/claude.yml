name: "Bot: Claude (Issue-Kommentare)"

# NOTE: pull_request_review_comment + pull_request_review triggers were removed
# deliberately. A reviewer that posts N inline comments (CodeRabbit, Claude's own
# review) fires N pull_request_review_comment events, each creating a skipped
# "Claude Code" run — the if: filter can't prevent run creation, only on: can.
# issue_comment covers top-level PR comments, so @claude still works there; the
# only loss is summoning @claude from inside an inline diff thread.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@38c80c1a32cdbc0c6f34042464a0669d89363dde # v1.0.246
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Model pinned like the review bot — the action default is not ours to pick.
          claude_args: '--model claude-opus-5-5 --effort medium'
