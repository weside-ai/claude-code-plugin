name: Compat line

# A PR that changes what a second repo runs (L0, roles, skills, the crew reader) says whether it
# was checked there (scripts/check_compat_line.py). Its own workflow so an edit of the PR body
# re-runs it; no path filter: the script decides from the diff itself.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  compat-line:
    name: Compat line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python3 scripts/check_compat_line.py
