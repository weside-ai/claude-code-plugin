# The plugin version rises by itself after every merge to main; no PR sets it (AGENTS.md § Versioning).
#
# On every push to main, `scripts/version_bump.py prepare` reads the Conventional Commits since the
# last bump and writes the next version into plugin.json's version line. This job commits it as
# github-actions[bot] onto the rolling branch `chore/version-bump`, opens or retitles its PR and
# arms auto-merge. A PR opened or pushed with GITHUB_TOKEN starts no workflow of its own, so the
# job dispatches CI and the Claude review on the branch; their checks land on the same commit and
# satisfy main's required checks. The review skips a bump PR by what it is (version_bump.py
# is_bump), never by this branch name. The merge, done with GITHUB_TOKEN, starts no new run here.
#
# Setup (repository admin, once): Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".

name: Version bump

on:
  push:
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    name: Rolling bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write the next version
        id: prep
        run: echo "version=$(python3 scripts/version_bump.py prepare)" >> "$GITHUB_OUTPUT"

      - name: Commit, push the bump branch, arm its PR, dispatch its checks
        if: steps.prep.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          BRANCH: chore/version-bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "chore: bump we to ${VERSION}" -- we/.claude-plugin/plugin.json
          git push -q -f origin "HEAD:refs/heads/${BRANCH}"
          title="chore: bump we to ${VERSION}"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title"
          else
            printf '%s\n\n%s\n' \
              "The version after the merges since the last bump (scripts/version_bump.py, workflow version-bump.yml)." \
              "Opened and merged by the workflow; it changes the version line of we/.claude-plugin/plugin.json and nothing else." \
              > "$RUNNER_TEMP/body.md"
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$number" --auto --merge
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run claude-code-review.yml --ref "$BRANCH"
